<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>スペルれんしゅう</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #fdf6e3;
    --card: #ffffff;
    --text: #3d2f1e;
    --muted: #8a7a63;
    --accent: #f5a623;
    --accent-dark: #d98c0f;
    --accent-text: #ffffff;
    --ok: #2e9e5b;
    --ok-bg: #e3f6eb;
    --ng: #d9534f;
    --ng-bg: #fdeaea;
    --border: #eadfc8;
    --input-bg: #fffdf7;
    --tile-bg: #fff3d6;
    --pink: #ff8fb8;
    --pink-dark: #e0608f;
    --pink-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1e1a14;
      --card: #2a251c;
      --text: #f3ead9;
      --muted: #a89a82;
      --accent: #f5a623;
      --accent-dark: #ffbe4d;
      --accent-text: #2a1d05;
      --ok: #5ed492;
      --ok-bg: #1f3a2b;
      --ng: #ff8a85;
      --ng-bg: #43211f;
      --border: #453c2d;
      --input-bg: #221d15;
      --tile-bg: #3a2f1c;
      --pink: #ff8fb8;
      --pink-dark: #ff6fa3;
      --pink-text: #3a0d1f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #1e1a14;
    --card: #2a251c;
    --text: #f3ead9;
    --muted: #a89a82;
    --accent: #f5a623;
    --accent-dark: #ffbe4d;
    --accent-text: #2a1d05;
    --ok: #5ed492;
    --ok-bg: #1f3a2b;
    --ng: #ff8a85;
    --ng-bg: #43211f;
    --border: #453c2d;
    --input-bg: #221d15;
    --tile-bg: #3a2f1c;
    --pink: #ff8fb8;
    --pink-dark: #ff6fa3;
    --pink-text: #3a0d1f;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDGothic", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.6;
    min-height: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; text-align: center; margin: 8px 0 2px; }
  .sub { text-align: center; color: var(--muted); font-size: .85rem; margin: 0 0 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-big {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 1.15rem;
    background: var(--accent);
    color: var(--accent-text);
    margin-top: 10px;
  }
  .btn-big:active { background: var(--accent-dark); }
  .btn-sub {
    display: block;
    width: 100%;
    padding: 13px;
    font-size: 1rem;
    background: transparent;
    color: var(--text);
    border: 2px solid var(--border);
    margin-top: 10px;
  }
  .btn-speak {
    display: block;
    margin: 0 auto 16px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    font-size: 3.2rem;
    background: var(--accent);
    color: var(--accent-text);
    box-shadow: 0 4px 14px rgba(245,166,35,.45);
  }
  .btn-speak:active { transform: scale(.96); }
  .btn-speak span { display: block; font-size: .8rem; margin-top: 2px; }
  .progress { text-align: center; color: var(--muted); font-weight: 700; margin-bottom: 12px; }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }
  input[type="text"] {
    width: 100%;
    padding: 14px;
    font-size: 1.6rem;
    text-align: center;
    text-transform: uppercase;
    letter-spacing: .12em;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--input-bg);
    color: var(--text);
    font-family: inherit;
  }
  input[type="text"]:focus { outline: 3px solid var(--accent); border-color: var(--accent); }
  .btn-big:disabled { opacity: .45; cursor: default; }
  .slots { display: flex; justify-content: center; gap: 5px; margin-bottom: 18px; }
  .slot {
    flex: 0 1 46px;
    min-width: 0;
    height: 56px;
    border: 3px dashed var(--border);
    border-radius: 12px;
    background: var(--input-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    font-weight: 800;
  }
  .slot.fixed { flex-basis: 16px; border: none; background: transparent; }
  .slots.long .slot { height: 46px; font-size: 1.2rem; }
  .pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; min-height: 64px; padding: 4px 0; }
  .tile {
    width: 52px;
    height: 58px;
    border-radius: 12px;
    background: var(--tile-bg);
    color: var(--text);
    border: 2px solid var(--accent);
    box-shadow: 0 3px 0 var(--accent-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 800;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .slot .tile { width: 100%; height: 100%; font-size: inherit; box-shadow: none; }
  .tile.dragging { position: relative; z-index: 10; box-shadow: 0 8px 18px rgba(0,0,0,.25); }
  .feedback { text-align: center; padding: 10px 0 4px; }
  .feedback .mark { font-size: 3rem; line-height: 1.2; }
  .feedback .word {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: .12em;
    margin: 6px 0 2px;
    word-break: break-all;
  }
  .feedback .meaning { font-size: 1.2rem; color: var(--text); margin-bottom: 6px; }
  .feedback.ok { color: var(--ok); }
  .feedback.ng { color: var(--ng); }
  .feedback .yours { font-size: 1rem; color: var(--muted); }
  .result-score { text-align: center; font-size: 2.4rem; font-weight: 800; margin: 6px 0; }
  .miss-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
  .miss-list b {
    background: var(--ng-bg);
    color: var(--ng);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 1rem;
    letter-spacing: .08em;
  }
  textarea {
    width: 100%;
    min-height: 300px;
    font-size: 1rem;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: var(--input-bg);
    color: var(--text);
    padding: 12px;
  }
  .row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: .95rem; }
  .row input { width: 22px; height: 22px; accent-color: var(--accent); }
  .row select {
    font-family: inherit;
    font-size: .95rem;
    padding: 8px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: var(--input-bg);
    color: var(--text);
    max-width: 230px;
  }
  .summary { text-align: center; font-size: 1.05rem; margin: 4px 0 0; }
  .note { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 10px; }
  .legend { color: var(--muted); font-size: .85rem; text-align: center; margin: 0 0 12px; }
  .score-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 4px;
    border-bottom: 1px solid var(--border);
  }
  .score-row:last-child { border-bottom: none; }
  .score-row .lv { font-size: 1.2rem; }
  .score-row .w { flex: 1; min-width: 0; }
  .score-row .w b { font-size: 1.05rem; letter-spacing: .06em; }
  .score-row .w small { display: block; color: var(--muted); font-size: .85rem; }
  .score-row .cnt { color: var(--muted); font-size: .85rem; white-space: nowrap; }
  .set-title { text-align: center; font-weight: 700; margin: 14px 0 0; }
  .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 10px; margin-top: 8px; }
  .set-btn { padding: 12px 6px; font-size: 1.1rem; line-height: 1.3; background: var(--accent); color: var(--accent-text); }
  .set-btn:active { background: var(--accent-dark); }
  .set-btn small { display: block; font-size: .8rem; opacity: .85; }
  .btn-gacha { background: var(--pink); color: var(--pink-text); }
  .btn-gacha:active { background: var(--pink-dark); }
  .gacha-left { text-align: center; color: var(--muted); font-weight: 700; margin: 0; }
  .gacha-stage { display: flex; justify-content: center; align-items: center; min-height: 250px; }
  .capsule {
    position: relative;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 4px solid var(--pink-dark);
    background: linear-gradient(to bottom, var(--pink) 0 50%, var(--card) 50% 100%);
  }
  .capsule::after { content: ""; position: absolute; left: -4px; right: -4px; top: calc(50% - 4px); height: 8px; background: var(--pink-dark); }
  .capsule.shake { animation: shake .25s ease-in-out 5; }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
  .prize {
    width: 210px;
    border: 4px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    padding: 16px 10px;
    text-align: center;
    animation: pop .45s ease-out;
  }
  .prize .em { font-size: 5rem; line-height: 1.15; }
  .prize .nm { font-size: 1.4rem; font-weight: 800; }
  .prize .rr { font-size: .95rem; color: var(--muted); font-weight: 700; }
  .prize .nw { font-weight: 800; color: var(--pink-dark); min-height: 1.6em; }
  .prize.rare { border-color: var(--pink); }
  .prize.kira, .zcell.kira {
    border-color: #e6b422;
    background: linear-gradient(135deg, #fff7cc, #ffd9ef, #d9ecff, #fff7cc);
    background-size: 300% 300%;
  }
  .prize.kira { animation: pop .45s ease-out, shimmer 3s linear infinite; }
  .prize.kira .nm, .prize.kira .rr, .zcell.kira .nm, .zcell.kira .ct { color: #3d2f1e; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes shimmer { to { background-position: 300% 300%; } }
  .zukan { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-bottom: 6px; }
  .zcell { min-width: 0; border: 3px solid var(--border); border-radius: 14px; padding: 6px 2px; text-align: center; }
  .zcell .em { font-size: 2.2rem; line-height: 1.25; }
  .zcell .nm { font-size: .7rem; font-weight: 700; overflow-wrap: anywhere; }
  .zcell .ct { font-size: .7rem; color: var(--muted); min-height: 1.2em; }
  .zcell.rare { border-color: var(--pink); }
  .zcell.none { background: transparent; border-style: dashed; }
  .zcell.none .em, .zcell.none .nm { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .capsule.shake, .prize, .prize.kira { animation: none; }
  }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🐝 スペルれんしゅう</h1>
  <p class="sub">きいて、おおもじで かいてみよう</p>

  <!-- ホーム -->
  <div id="screen-home" class="card">
    <p style="text-align:center; font-size:1.05rem; margin:0;">たんご：<b id="home-count"></b>こ</p>
    <p class="summary" id="home-summary"></p>
    <p class="set-title">▶ セットを えらんで はじめる（10もんずつ）</p>
    <div class="sets" id="home-sets"></div>
    <button class="btn-sub hidden" id="btn-weak"></button>
    <button class="btn-big btn-gacha hidden" id="btn-gacha-home"></button>
    <label class="row"><input type="checkbox" id="chk-shuffle"> じゅんばんを シャッフルする</label>
    <label class="row"><input type="checkbox" id="chk-keyboard"> ⌨️ カードではなく キーボードで かく</label>
    <label class="row"><input type="checkbox" id="chk-sound"> 🔔 ⭕❌の こえを だす（Good job! など）</label>
    <label class="row">🗣️ こえ
      <select id="sel-voice"><option value="">じどうで えらぶ</option></select>
    </label>
    <button class="btn-sub" id="btn-score">📊 せいせきを みる</button>
    <button class="btn-sub" id="btn-zukan">🎀 カードずかん</button>
    <button class="btn-sub" id="btn-edit">📝 たんごリストを かえる</button>
    <p class="note">🔊ボタンで 3かい よみあげます（ほんばんと おなじ）</p>
  </div>

  <!-- クイズ -->
  <div id="screen-quiz" class="hidden">
    <div class="card">
      <div class="progress" id="quiz-progress"></div>
      <div class="bar"><i id="quiz-bar" style="width:0%"></i></div>
      <div id="quiz-ask">
        <button class="btn-speak" id="btn-speak">🔊<span>きく</span></button>
        <div id="quiz-cards">
          <div class="slots" id="card-slots"></div>
          <div class="pool" id="card-pool"></div>
        </div>
        <input type="text" id="quiz-input" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="done" placeholder="ここに かく">
        <button class="btn-big" id="btn-check">けってい</button>
      </div>
      <div id="quiz-fb" class="hidden">
        <div class="feedback" id="fb-box">
          <div class="mark" id="fb-mark"></div>
          <div id="fb-label"></div>
          <div class="word" id="fb-word"></div>
          <div class="meaning" id="fb-mean"></div>
          <div class="yours" id="fb-yours"></div>
        </div>
        <button class="btn-big" id="btn-next">つぎへ ▶</button>
      </div>
    </div>
    <button class="btn-sub" id="btn-quit">やめて ホームに もどる</button>
  </div>

  <!-- けっか -->
  <div id="screen-result" class="hidden">
    <div class="card">
      <p style="text-align:center; font-size:1.2rem; margin:0;">けっか</p>
      <div class="result-score" id="result-score"></div>
      <div id="result-msg" style="text-align:center; font-size:1.3rem;"></div>
      <div class="miss-list" id="result-miss"></div>
      <button class="btn-big btn-gacha" id="btn-gacha-result">🎁 ガチャを まわす！</button>
      <button class="btn-sub hidden" id="btn-retry-miss">❌ まちがえたのだけ もういちど</button>
      <button class="btn-sub" id="btn-home1">ホームに もどる</button>
    </div>
  </div>

  <!-- せいせき -->
  <div id="screen-score" class="hidden">
    <div class="card">
      <p style="text-align:center; font-size:1.2rem; margin:0 0 6px;">📊 せいせき</p>
      <p class="legend">🟢 2かい れんぞく せいかい　🟡 あと 1かい！<br>🔴 このまえ まちがえた　⚪ まだ やってない</p>
      <div id="score-list"></div>
      <button class="btn-big hidden" id="btn-weak2"></button>
      <button class="btn-sub" id="btn-stats-reset">きろくを ぜんぶ けす</button>
      <button class="btn-sub" id="btn-home3">ホームに もどる</button>
    </div>
  </div>

  <!-- ガチャ -->
  <div id="screen-gacha" class="hidden">
    <div class="card">
      <p class="gacha-left" id="gacha-left"></p>
      <div class="gacha-stage">
        <div class="capsule" id="gacha-capsule"></div>
        <div class="prize hidden" id="gacha-prize">
          <div class="em" id="prize-em"></div>
          <div class="nm" id="prize-nm"></div>
          <div class="rr" id="prize-rr"></div>
          <div class="nw" id="prize-nw"></div>
        </div>
      </div>
      <button class="btn-big btn-gacha" id="btn-spin">まわす！</button>
      <button class="btn-sub" id="btn-gacha-zukan">🎀 ずかんを みる</button>
      <button class="btn-sub" id="btn-home4">ホームに もどる</button>
    </div>
  </div>

  <!-- ずかん -->
  <div id="screen-zukan" class="hidden">
    <div class="card">
      <p style="text-align:center; font-size:1.2rem; margin:0 0 4px;">🎀 カードずかん</p>
      <p class="legend" id="zukan-count"></p>
      <div class="zukan" id="zukan-list"></div>
      <button class="btn-sub" id="btn-home5">ホームに もどる</button>
    </div>
  </div>

  <!-- へんしゅう -->
  <div id="screen-edit" class="hidden">
    <div class="card">
      <p style="margin-top:0; font-size:.95rem;">1ぎょうに 1たんご。「たんご = いみ」の かたちで かいてね（いみは なくても OK）</p>
      <textarea id="edit-area"></textarea>
      <button class="btn-big" id="btn-save">ほぞんする</button>
      <button class="btn-sub" id="btn-reset">スペリングビーの 50こに もどす</button>
      <button class="btn-sub" id="btn-home2">ほぞんしないで もどる</button>
    </div>
  </div>
</div>

  var RARITY_NAME = ["ノーマル", "⭐ レア", "✨ キラキラ"];

  /* ---- ⭕❌のこえ（英語でほめる・はげます） ---- */
  var soundOn = true;

  var OK_PHRASES = ["Good job!", "Great job!", "Well done!", "Awesome!"];

  function playSound(ok){

  function norm(s){ return String(s).replace(/\s+/g, " ").trim().toUpperCase(); }
  function defaultMeaning(w){

  var words = DEFAULT_LIST.slice();

    if (!words.length) words = DEFAULT_LIST.slice();
    shuffleOn = localStorage.getItem("spell_shuffle") === "1";
    keyboardOn = localStorage.getItem("spell_keyboard") === "1";
    var sv = localStorage.getItem("spell_voice");

  } catch (e) {}

  /* ---- せいせき（単語ごとの記録） ---- */
  var stats = {};
  try {
    var s = JSON.parse(localStorage.getItem("spell_stats") || "{}");
    if (s && typeof s === "object") stats = s;
  } catch (e) {}
  /* ---- セットの ベスト・ガチャけん・あつめた カード ---- */
  var setBest = {}, tickets = [], owned = {};
  try {
    var sb0 = JSON.parse(localStorage.getItem("spell_set_best") || "{}");
    if (sb0 && typeof sb0 === "object") setBest = sb0;
    var tk0 = JSON.parse(localStorage.getItem("spell_tickets") || "[]");

  function saveGacha(){

  function levelOf(w){
    var r = stats[norm(w)];
    if (!r || (r.ok + r.ng) === 0) return "⚪";

    if (r.st === 1) return "🟡";

  /* ---- 読み上げ ---- */
  function englishVoices(){
    var vs = [];

  }
  function voiceScore(v){
    var s = 0;
    if (/^en-?US/i.test(v.lang)) s += 4;
    else if (/^en-?GB/i.test(v.lang)) s += 3;
    else s += 1;
    if (/samantha|alex|ava|allison|aaron|nicky|karen|daniel|google (us|uk) english/i.test(v.name)) s += 4;
    if (/enhanced|premium|拡張/i.test(v.name)) s += 2;
    if (/compact/i.test(v.name)) s -= 2;
    return s;
  }
  function samanthaVoice(){
    var sam = englishVoices().filter(function(v){ return /samantha/i.test(v.name); });
    sam.sort(function(a, b){ return voiceScore(b) - voiceScore(a); });
    return sam[0] || null;
  }
  function resolveVoice(){
    var en = englishVoices();
    if (!en.length) return null;
    if (savedVoiceURI) {
      for (var i = 0; i < en.length; i++) {
        if (en[i].voiceURI === savedVoiceURI) return en[i];

  function fillVoiceSelect(){

  function refreshHome(){

      var best = document.createElement("small");

  /* ---- クイズ ---- */
  function shuffleInPlace(a){
    for (var i = a.length - 1; i > 0; i--) {

      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
  }
  function startQuiz(list, key){
    if (!list.length) return;

  function ask(){
    $("quiz-ask").classList.remove("hidden");

  /* ---- もじカード（タップ or ドラッグで わくに いれる） ---- */
  var tiles = [], slotFixed = [], slotTile = [];
  function setupCards(word){
    tiles = []; slotFixed = []; slotTile = [];
    norm(word).split("").forEach(function(c){
      if (/[A-Z]/.test(c)) { tiles.push({ch: c, rot: Math.round(Math.random() * 16 - 8)}); slotFixed.push(""); }
      else { slotFixed.push(c); } /* スペースや - は さいしょから うめておく */
      slotTile.push(-1);
    });
    var orig = tiles.map(function(t){ return t.ch; }).join("");
    for (var k = 0; k < 10; k++) {
      shuffleInPlace(tiles);
      if (tiles.map(function(t){ return t.ch; }).join("") !== orig) break;
    }

  }
  function cardsFull(){
    return slotFixed.every(function(f, i){ return f || slotTile[i] >= 0; });

  function cardAnswer(){

  }
  function renderCards(){
    var sb = $("card-slots"), pb = $("card-pool");
    sb.innerHTML = ""; pb.innerHTML = "";
    sb.classList.toggle("long", slotFixed.length >= 8);
    slotFixed.forEach(function(f, i){
      var d = document.createElement("div");
      d.className = f ? "slot fixed" : "slot";
      d.setAttribute("data-slot", i);
      if (f) d.textContent = f;
      else if (slotTile[i] >= 0) d.appendChild(makeTile(slotTile[i], false));
      sb.appendChild(d);
    });

    });

  }
  function makeTile(ti, inPool){
    var el = document.createElement("div");
    el.className = "tile";
    el.textContent = tiles[ti].ch;
    if (inPool) el.style.transform = "rotate(" + tiles[ti].rot + "deg)";
    var drag = null;
    el.addEventListener("pointerdown", function(ev){
      if (ev.button) return;
      ev.preventDefault();
      drag = {x: ev.clientX, y: ev.clientY, moved: false};
      try { el.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    el.addEventListener("pointermove", function(ev){
      if (!drag) return;
      var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (!drag.moved && dx * dx + dy * dy > 64) { drag.moved = true; el.classList.add("dragging"); }
      if (drag.moved) el.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.1)";
    });
    el.addEventListener("pointerup", function(ev){
      if (!drag) return;
      var moved = drag.moved;
      drag = null;
      if (!moved) { tapTile(ti); return; }
      el.style.visibility = "hidden";
      var under = document.elementFromPoint(ev.clientX, ev.clientY);
      var s = under && under.closest("[data-slot]");

  function tapTile(ti){

  function dropTile(ti, to){
    var from = slotTile.indexOf(ti);

    } else if (to !== from) {
      var other = slotTile[to];
      slotTile[to] = ti;
      if (from >= 0) slotTile[from] = other; /* わく どうしなら いれかえ */
    }

  }
  function setSpeakLabel(){

  /* ---- ガチャ ---- */
  var spinning = false;
  function drawCard(acc){

    var x = Math.random() * 100;
    var r = x < w[0] ? 0 : x < w[0] + w[1] ? 1 : 2;
    var pool = CARDS.filter(function(c){ return c.r === r; });
    var fresh = pool.filter(function(c){ return !owned[c.e]; });

  }

  /* ---- ずかん ---- */
  function refreshZukan(){
    var box = $("zukan-list");

    CARDS.forEach(function(c){
      var n = owned[c.e] || 0;
      if (n) have++;
      var d = document.createElement("div");
      d.className = "zcell " + RARITY_CLASS[c.r] + (n ? "" : " none");
      var em = document.createElement("div"); em.className = "em"; em.textContent = n ? c.e : "？";
      var nm = document.createElement("div"); nm.className = "nm"; nm.textContent = n ? c.n : "？？？";
      var ct = document.createElement("div"); ct.className = "ct"; ct.textContent = n > 1 ? "×" + n : "";
      d.appendChild(em); d.appendChild(nm); d.appendChild(ct);
      box.appendChild(d);
    });
    $("zukan-count").textContent = "あつめた カード " + have + " / " + CARDS.length + "　⭐レア　✨キラキラ";
  }
  $("btn-home5").addEventListener("click", function(){ show("home"); });

  /* ---- せいせき ---- */
  function refreshScore(){
    var order = {"🔴": 0, "🟡": 1, "⚪": 2, "🟢": 3};
    var rows = words.map(function(x, idx){ return {x: x, lv: levelOf(x.w), idx: idx}; });
    rows.sort(function(a, b){ return (order[a.lv] - order[b.lv]) || (a.idx - b.idx); });
    var box = $("score-list");
    box.innerHTML = "";
    rows.forEach(function(r){
      var rec = stats[norm(r.x.w)] || {ok: 0, ng: 0};
      var div = document.createElement("div");
      div.className = "score-row";
      var lv = document.createElement("span"); lv.className = "lv"; lv.textContent = r.lv;
      var wbox = document.createElement("div"); wbox.className = "w";
      var b = document.createElement("b"); b.textContent = norm(r.x.w);
      var sm = document.createElement("small"); sm.textContent = r.x.m || "";
      wbox.appendChild(b); wbox.appendChild(sm);
      var cnt = document.createElement("span"); cnt.className = "cnt";
      cnt.textContent = "⭕" + rec.ok + " ❌" + rec.ng;
      div.appendChild(lv); div.appendChild(wbox); div.appendChild(cnt);
      box.appendChild(div);
    });
    var wk = weakWords();
    var b2 = $("btn-weak2");
    if (wk.length) {
      b2.textContent = "💪 にがてな " + wk.length + "こだけ れんしゅう";
      b2.classList.remove("hidden");
    } else {
      b2.classList.add("hidden");
    }
  }
  $("btn-weak2").addEventListener("click", function(){ startQuiz(weakWords()); });
  $("btn-stats-reset").addEventListener("click", function(){
    if (!confirm("せいせきの きろくを ぜんぶ けしますか？")) return;
    stats = {};
    saveStats();
    refreshScore();
  });
  $("btn-home3").addEventListener("click", function(){ show("home"); });

  /* ---- へんしゅう ---- */
  $("btn-save").addEventListener("click", function(){
    var lines = $("edit-area").value.split("\n").map(function(s){ return s.trim(); }).filter(function(s){ return s.length; });
    if (!lines.length) { alert("たんごを 1つ いじょう かいてね"); return; }
    words = lines.map(function(line){
      var cut = -1;
      for (var i = 0; i < line.length; i++) {
        if (line[i] === "=" || line[i] === "＝") { cut = i; break; }
      }
      if (cut < 0) {
        var w0 = line.trim();
        return {w: w0, m: defaultMeaning(w0)};
      }
      return {w: line.slice(0, cut).trim(), m: line.slice(cut + 1).trim()};
    }).filter(function(x){ return x.w.length; });
    if (!words.length) { words = DEFAULT_LIST.slice(); }
    try { localStorage.setItem("spell_words_v2", JSON.stringify(words)); } catch (e) {}
    show("home");
  });
  $("btn-reset").addEventListener("click", function(){
    $("edit-area").value = DEFAULT_LIST.map(function(x){ return x.w + " = " + x.m; }).join("\n");
  });
  $("btn-home2").addEventListener("click", function(){ show("home"); });

  refreshHome();
})();
</script>
</body>
</html>
